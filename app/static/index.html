<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuackParser Hub</title>
    <!-- Tailwind CSS (最新の v4 Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-slate-900 min-h-screen text-slate-100 flex flex-col items-center p-6 font-sans"
  >
    <div
      class="w-full max-w-6xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700"
    >
      <!-- ヘッダーエリア -->
      <div class="flex items-center space-x-3 mb-2">
        <span class="text-4xl">🦆</span>
        <div>
          <h1 class="text-2xl font-black tracking-wider text-amber-400">
            QUACK PARSER
          </h1>
          <p class="text-xs text-slate-400">
            Local AI Document Analytics Engine
          </p>
        </div>
      </div>
      <p class="text-sm text-slate-300 mb-6">
        PDF、Office、画像をドラッグして、瞬時に構造化されたドキュメントデータを抽出。
      </p>

      <!-- ドロップゾーン -->
      <div
        id="drop-zone"
        class="border-2 border-dashed border-slate-600 rounded-xl p-10 text-center cursor-pointer hover:border-amber-400 hover:bg-slate-700/50 transition-all group"
      >
        <p
          class="text-slate-300 font-medium group-hover:text-amber-400 transition-colors"
        >
          ここにファイルをドラッグ＆ドロップ、またはクリックして選択
        </p>
        <p class="text-xs text-slate-500 mt-1">
          対応: PDF, DOCX, PPTX, XLSX, PNG, JPG
        </p>
        <input
          type="file"
          id="file-input"
          class="hidden"
          accept=".pdf,.docx,.pptx,.xlsx,.png,.jpg"
        />
      </div>

      <!-- ローディングアニメーション -->
      <div
        id="loading"
        class="hidden mt-6 text-center text-amber-400 font-bold animate-pulse text-sm"
      >
        <span class="inline-block animate-spin mr-2">⚙️</span> QuackParser
        が文書をディープ解析中...
      </div>

      <!-- 結果表示エリア -->
      <div id="result-container" class="hidden mt-8 w-full animate-fade-in">
        <!-- 生のMarkdown -->
        <div class="flex flex-col w-full">
          <div class="flex justify-between items-center mb-2 px-1">
            <span
              class="text-xs font-bold tracking-widest text-slate-400 uppercase"
              >Raw Markdown</span
            >
            <button
              id="copy-btn"
              class="text-xs bg-slate-700 hover:bg-amber-400 hover:text-slate-950 px-2 py-1 rounded transition-colors font-semibold"
            >
              Copy
            </button>
          </div>
          <textarea
            id="output-raw"
            class="w-full h-[550px] p-4 font-mono text-xs bg-slate-950 text-emerald-400 rounded-xl border border-slate-800 resize-none focus:outline-none"
            readonly
          ></textarea>
        </div>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const loading = document.getElementById("loading");
      const resultContainer = document.getElementById("result-container");
      const outputRaw = document.getElementById("output-raw");
      const copyBtn = document.getElementById("copy-btn");

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("border-amber-400", "bg-slate-700/50");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("border-amber-400", "bg-slate-700/50");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("border-amber-400", "bg-slate-700/50");
        if (e.dataTransfer.files.length > 0)
          uploadFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) uploadFile(e.target.files[0]);
      });

      async function uploadFile(file) {
        loading.classList.remove("hidden");
        resultContainer.classList.add("hidden");

        // multipart/form-data でファイルを送信する
        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("/convert", {
            method: "POST",
            body: formData,
            // multipart/form-data の Content-Type はブラウザが自動で設定するため指定しない
          });
          const data = await response.json();
          if (data.success) {
            // 生のMarkdownを入力
            outputRaw.value = data.markdown;
            resultContainer.classList.remove("hidden");
          } else {
            alert("QuackParser エラー: " + data.error);
          }
        } catch (err) {
          alert("通信エラーが発生しました。");
        } finally {
          loading.classList.add("hidden");
        }
      }

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(outputRaw.value);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 2000);
      });
    </script>
  </body>
</html>
